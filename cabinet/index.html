<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Кабинет члена — БОАР</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,500;0,7..72,600;0,7..72,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/cabinet/cabinet.css" />
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="brand" href="/">БОАР</a>
      <span class="top-label">Кабинет · демо</span>
      <div class="top-user" id="top-user" hidden>
        <span id="user-name"></span>
        <button type="button" class="ghost" id="logout-btn">Выйти</button>
      </div>
    </header>

    <main>
      <section class="panel" id="login-panel">
        <p class="eyebrow">Вход</p>
        <h1>Личный кабинет</h1>
        <p class="lead">Минимальный мессенджер для членов общества. Сессия сохраняется в cookie, сообщения — в файл на сервере.</p>
        <form class="login-form" id="login-form">
          <label>Логин<input name="login" autocomplete="username" required placeholder="admin" /></label>
          <label>Пароль<input name="password" type="password" autocomplete="current-password" required placeholder="admin" /></label>
          <p class="error" id="login-error" hidden></p>
          <button type="submit">Войти</button>
          <p class="hint">Демо: <code>admin</code> / <code>admin</code> · <code>doktor</code> / <code>doktor</code></p>
        </form>
      </section>

      <section class="chat" id="chat-panel" hidden>
        <aside class="chat-side">
          <p class="eyebrow">Канал</p>
          <h2>Общий чат БОАР</h2>
          <p class="muted">Все, кто вошёл, пишут в одну ленту. Обновление каждые 3 секунды.</p>
          <a class="back" href="/">← На сайт</a>
        </aside>
        <div class="chat-main">
          <div class="messages" id="messages" aria-live="polite"></div>
          <form class="composer" id="composer">
            <input id="message-input" name="text" maxlength="2000" placeholder="Написать сообщение…" autocomplete="off" required />
            <button type="submit">Отправить</button>
          </form>
        </div>
      </section>
    </main>
  </div>
  <script src="/cabinet/cabinet.js"></script>
</body>
</html>
